name: Build

on:
  push:
    branches:
      - gh-pages-test  # temporary, for testing — remove before merging
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VULKAN_SDK_VERSION: 1.4.304.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-64bits
          - os: ubuntu-latest
            platform: linux-64bits

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "Version: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_SDK_VERSION }}/windows/VulkanSDK-${{ env.VULKAN_SDK_VERSION }}-Installer.exe"
          Write-Host "Downloading Vulkan SDK from $url"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK-Installer.exe
          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath .\VulkanSDK-Installer.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkPath = "C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libx11-dev libxcb1-dev libxcb-keysyms1-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libtbb-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DDISABLE_DEFAULT_SCENE=ON
          -DDISABLE_MESH_ASSETS_DOWNLOAD=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix _install

      - name: Prepare package
        shell: bash
        run: |
          folder="vkgs-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          mkdir staging
          mv _install "staging/${folder}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            chmod +x "staging/${folder}/vk_gaussian_splatting"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vkgs-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: staging
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for VERSION file)
        uses: actions/checkout@v4
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "Version: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release archives
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          cd artifacts
          zip -r "../vkgs-${version}-windows-64bits.zip" "vkgs-${version}-windows-64bits"
          tar -czf "../vkgs-${version}-linux-64bits.tar.gz" "vkgs-${version}-linux-64bits"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            vkgs-*.zip
            vkgs-*.tar.gz
